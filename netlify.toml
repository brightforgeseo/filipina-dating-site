[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-style fallback is not needed — Astro static output covers every route,
# and dist/404.html is served automatically for unknown paths.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src/connect-src are deliberately not restricted: Astro inlines
    # hydration scripts and Firebase talks to many Google endpoints.
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Hashed build assets are safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
